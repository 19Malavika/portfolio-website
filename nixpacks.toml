[build]
  builder = "nixpacks"

[build.env]
  NIXPACKS_PHP_VERSION = "8.2"

[deploy]
  startCommand = "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[service]
  internalPort = 8080
